// This is what prevents multiple names in flight at once from racing to the
// same spot and landing on top of each other (unreadable overlapping text).
let reserved = [];
let cycleActive = true;
let resetting = false;

function floorPx(){ return window.innerHeight * FLOOR_FRAC; }
function topSafePx(){ return window.innerHeight * TOP_SAFE_FRAC; }

// Clears EVERY name currently on stage — including ones still mid-fall —
// so a name that was falling toward a now-obsolete landing spot can never
// get stranded floating above an emptied pile (the "frozen name" bug).
function resetPile(){
  if(resetting) return;
  resetting = true;
  cycleActive = false;
  const items = document.querySelectorAll('.name-item.spawned');
  items.forEach(el => {
    el.style.transition = 'opacity 0.9s ease, transform 0.9s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
  });
  setTimeout(() => {
    items.forEach(el => el.remove());
    reserved = [];
    resetting = false;
    cycleActive = true;
  }, 1100);
}

function spawnName(){
  if(!cycleActive) return;
  if(idx >= order.length){ idx = 0; reshuffle(); }
  const p = order[idx++];

  const el = document.createElement('div');
  el.className = 'name-item spawned';
  const size = fontSizesVW[Math.floor(Math.random() * fontSizesVW.length)];
  el.style.fontSize = `min(${size}vw, ${(size * 1.85)}vh)`;
  el.style.visibility = 'hidden';
  el.style.left = '0px';
  el.style.top = '-300px';
  el.innerHTML = `<span>${p.name}</span>`;
  stage.appendChild(el);

  // measure after it's in the DOM
  requestAnimationFrame(() => {
    // bail out if a reset started while this name was being prepared
    if(!cycleActive){ el.remove(); return; }

    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const margin = 10;
    const maxLeft = Math.max(margin, window.innerWidth - w - margin);
    const left = margin + Math.random() * Math.max(0, maxLeft - margin);
    const right = left + w + ROW_PADDING; // padded so neighbors never touch
    const leftPadded = left - ROW_PADDING;

    // land on top of any reserved spot (falling or already landed) that overlaps in x
    let landingBottom = floorPx();
    for(const item of reserved){
      if(leftPadded < item.right && right > item.left){
        if(item.top < landingBottom) landingBottom = item.top;
      }
    }
    const landingTop = landingBottom - h;

    // pile already reaching up toward the title -> reset instead of placing this one
    if(landingTop < topSafePx()){
      el.remove();
      resetPile();
      return;
    }

    // reserve the spot immediately so the next name (even mid-flight) stacks above it
    reserved.push({ left: leftPadded, right, top: landingTop });

    el.style.left = left + 'px';
    el.style.top = (-h) + 'px';
    el.style.visibility = 'visible';

    requestAnimationFrame(() => {
      if(!cycleActive){ el.remove(); return; }
      const fallDuration = 3.2 + Math.random() * 2.0; // 4x original fall time
      // gravity-like acceleration into the landing spot
      el.style.transition = `top ${fallDuration}s cubic-bezier(0.55,0,0.85,1)`;
      el.style.top = landingTop + 'px';
    });

    el.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName !== 'top') return;
      el.removeEventListener('transitionend', onEnd);
      if(!cycleActive || !el.isConnected) return; // reset happened mid-fall
      el.classList.add('landed');
      el.animate(
        [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.88)' }, { transform: 'scaleY(1)' }],
        { duration: 220, easing: 'ease-out' }
      );
    });
  });
}

setInterval(spawnName, 650);
for(let i = 0; i < 3; i++){ setTimeout(spawnName, i * 400); }
</script>
