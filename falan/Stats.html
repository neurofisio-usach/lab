    aspect-ratio:484/600;
    opacity:0.10;
    z-index:0;
    pointer-events:none;
  }

  .header{
    position:absolute; top:4.5%; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5; width:90%;
  }
  .header .eyebrow{
    font-size:min(1.3vw, 2.3vh); letter-spacing:0.22em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin:0 0 0.4em; white-space:nowrap;
  }
  .header h1{
    font-size:min(3.2vw, 5.6vh); font-weight:600; margin:0; letter-spacing:0.02em;
    line-height:1.15;
  }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding-top:16vh; padding-bottom:5vh; box-sizing:border-box;
    opacity:0; z-index:2;
    transition:opacity 0.9s ease;
    pointer-events:none;
    overflow:hidden;
  }
  .screen.active{ opacity:1; pointer-events:auto; }
  .screen.centered{ justify-content:center; padding-top:16vh; }

  .content{
    width:84%; max-width:1200px;
    box-sizing:border-box;
  }

  /* ===== Headline screen ===== */
  .headline-numbers{
    display:flex; justify-content:center; gap:8vw; margin-top:2vh;
  }
  .big-stat{ text-align:center; }
  .big-stat .num{
    font-size:min(7vw, 13vh); font-weight:700; color:var(--accent);
    line-height:1; text-shadow:0 4px 24px rgba(244,168,37,0.25);
  }
  .big-stat .label{
    font-size:min(1.8vw, 3.2vh); color:var(--muted); margin-top:0.6em;
    letter-spacing:0.05em; text-transform:uppercase;
  }

  /* ===== Stat card grid (membership, gender, program) ===== */
  .stat-grid{
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:2.2vw; margin-top:2vh;
  }
  .stat-card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:2.2vh 1.4vw;
    text-align:center;
  }
  .stat-card .num{
    font-size:min(6.5vw, 11vh); font-weight:700; color:var(--accent); line-height:1;
  }
  .stat-card .label{
    font-size:min(2.0vw, 3.4vh); color:var(--muted); margin-top:0.7em; letter-spacing:0.03em;
  }
  .stat-card .sublabel{
    font-size:min(1.4vw, 2.3vh); color:var(--muted); opacity:0.7; margin-top:0.4em;
  }

  /* ===== Bar list (career, gender) ===== */
  .bar-list{ margin-top:1vh; display:flex; flex-direction:column; gap:2.2vh; }
  .bar-row{ display:flex; align-items:center; gap:1.2vw; }
  .bar-row .bar-label{
    width:30vw; font-size:min(2.1vw, 4vh); color:var(--text); text-align:right;
    flex-shrink:0; line-height:1.15;
  }
  .bar-row .bar-track{
    flex:1; height:3.2vh; background:none; border-radius:6px; overflow:visible;
  }
  .bar-row .bar-fill{
    height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #f9c25f);
    border-radius:6px; transition:width 1.4s cubic-bezier(0.22,1,0.36,1);
  }
  .bar-row .bar-num{
    width:5.5vw; font-size:min(2.2vw, 4.2vh); font-weight:700; color:var(--accent); flex-shrink:0;
  }

  /* ===== Two-column country grid ===== */
  .country-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:0 3vw;
    margin-top:1vh;
  }
  .country-col{ display:flex; flex-direction:column; gap:0.9vh; }
  .country-row{
    display:flex; align-items:center; gap:0.7vw;
    font-size:min(1.35vw, 2.3vh);
  }
  .country-row .flag{ font-size:1.3em; }
  .country-row .cname{ flex:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .country-row .ctrack{
    width:5vw; height:1.5vh; background:none; border-radius:4px; overflow:visible; flex-shrink:0;
  }
  .country-row .cfill{
    height:100%; width:0%; background:var(--accent); border-radius:4px;
    transition:width 1.2s cubic-bezier(0.22,1,0.36,1);
  }
  .country-row .cnum{ width:3.2vw; text-align:right; color:var(--muted); font-weight:600; flex-shrink:0; }

  /* ===== Society list ===== */
  .society-list{ margin-top:1vh; display:flex; flex-direction:column; gap:1.3vh; }
  .society-row{
    display:flex; align-items:center; gap:1vw; font-size:min(1.5vw, 2.5vh);
  }
  .society-row .flag{ font-size:1.3em; flex-shrink:0; }
  .society-row .sname{ flex:1; color:var(--text); white-space:normal; line-height:1.25; }
  .society-row .strack{
    width:8vw; height:1.6vh; background:none; border-radius:5px; overflow:visible; flex-shrink:0;
  }
  .society-row .sfill{
    height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #f9c25f);
    border-radius:5px; transition:width 1.3s cubic-bezier(0.22,1,0.36,1);
  }
  .society-row .snum{ width:3.2vw; text-align:right; font-weight:700; color:var(--accent); flex-shrink:0; }

  .footnote{
    position:absolute; bottom:3%; left:50%; transform:translateX(-50%);
    font-size:min(0.95vw, 1.7vh); color:var(--muted); opacity:0.65; text-align:center; width:80%;
  }
</style>
</head>

const SCREEN_DURATION = 7000; // ms each screen is shown
const FOOTNOTES = [
  "",

  `${DATA.career.reduce((a,c)=>a+c.count,0)} of ${DATA.total_participants} participants reported a career stage.`,
  "Membership status reflects FALAN Member Society affiliation self-reported at registration; \"Non-Members\" includes participants who left this question blank. Figures sum to the full 1,035 participants.",
  "Early-career and symposium-interest figures reflect self-reported responses at registration.",
  `Showing FALAN Member Societies with the most participants; smaller Chilean scientific societies omitted for clarity. ${DATA.societies_represented} societies shown.`,
  `${DATA.posters_total} posters submitted, ${DATA.posters_withdrawn} withdrawn — ${DATA.posters_active} presented.`
];

function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

function animateCountUp(el, target, duration=1600){
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = easeOutExpo(p);
    const val = Math.round(target * eased);
    el.textContent = val.toLocaleString('en-US');
    if(p < 1) requestAnimationFrame(tick);
    else el.textContent = target.toLocaleString('en-US');
  }
  requestAnimationFrame(tick);
}

function buildCountryGrid(){
  const grid = document.getElementById('countryGrid');
  const colA = document.createElement('div'); colA.className = 'country-col';
  const colB = document.createElement('div'); colB.className = 'country-col';
  grid.appendChild(colA); grid.appendChild(colB);
  const maxCount = DATA.countries[0].count;
  const half = Math.ceil(DATA.countries.length / 2);
  DATA.countries.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'country-row';
    row.innerHTML = `<span class="flag">${c.flag}</span><span class="cname">${c.name}</span>
      <span class="ctrack"><span class="cfill" data-w="${(c.count/maxCount*100).toFixed(1)}"></span></span>
      <span class="cnum" data-count="${c.count}">0</span>`;
    (i < half ? colA : colB).appendChild(row);
  });
}

function buildBarList(containerId, items, maxOverride){
  const container = document.getElementById(containerId);
  const max = maxOverride || Math.max(...items.map(i => i.count));
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `<span class="bar-label">${item.label}</span>
      <span class="bar-track"><span class="bar-fill" data-w="${(item.count/max*100).toFixed(1)}"></span></span>
      <span class="bar-num" data-count="${item.count}">0</span>`;
    container.appendChild(row);
  });
}

function buildSocietyList(){
  const container = document.getElementById('societyList');
  const max = DATA.societies[0].count;
  DATA.societies.forEach(s => {
    const row = document.createElement('div');
    row.className = 'society-row';
    row.innerHTML = `<span class="flag">${s.flag}</span><span class="sname">${s.name}</span>
      <span class="strack"><span class="sfill" data-w="${(s.count/max*100).toFixed(1)}"></span></span>
      <span class="snum" data-count="${s.count}">0</span>`;
    container.appendChild(row);
  });
}

buildCountryGrid();
buildBarList('careerBars', DATA.career);
buildBarList('genderBars', DATA.gender);
buildSocietyList();

function activateScreen(el){
  // trigger count-ups
  el.querySelectorAll('[data-count]').forEach(node => {
    const target = parseInt(node.getAttribute('data-count'), 10);
    animateCountUp(node, target);
  });
  // trigger bar widths (need a reflow before setting width for transition to fire)
  const bars = el.querySelectorAll('[data-w]');
  bars.forEach(b => { b.style.width = '0%'; });
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bars.forEach(b => { b.style.width = b.getAttribute('data-w') + '%'; });
    });
  });
}

function resetScreen(el){
  el.querySelectorAll('[data-count]').forEach(node => { node.textContent = '0'; });
  el.querySelectorAll('[data-w]').forEach(b => { b.style.width = '0%'; });
}

function nextScreen(){
  if(current >= 0) resetScreen(screens[current]);
  screens.forEach(s => s.classList.remove('active'));
  current = (current + 1) % screens.length;
  const el = screens[current];
  el.classList.add('active');
  screenTitle.textContent = el.getAttribute('data-title');
  footnote.textContent = FOOTNOTES[current] || '';
  setTimeout(() => activateScreen(el), 150);
  restartAutoAdvance();
}

function prevScreen(){
  if(current >= 0) resetScreen(screens[current]);
  screens.forEach(s => s.classList.remove('active'));
  current = (current - 1 + screens.length) % screens.length;
  const el = screens[current];
  el.classList.add('active');
  screenTitle.textContent = el.getAttribute('data-title');
  footnote.textContent = FOOTNOTES[current] || '';
  setTimeout(() => activateScreen(el), 150);
  restartAutoAdvance();
}

let autoAdvanceTimer;
function restartAutoAdvance(){
  clearInterval(autoAdvanceTimer);
  autoAdvanceTimer = setInterval(nextScreen, SCREEN_DURATION);
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight'){
    nextScreen();
  } else if(e.key === 'ArrowLeft'){
    prevScreen();
  }
});

nextScreen();
